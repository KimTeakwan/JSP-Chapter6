<script>
// 객체와 배열 고급(2)

// 객체를 생성합니다.
const object = {
    name: '혼자 공부하는 파이썬',
    price: 18000,
    publisher: '한빛미디어'
}

// 객체의 기본 속성을 지정합니다.
// 'object.name'이 정의되지 않았을 때만 '알 수 없음'으로 할당합니다.
object.name = object.name !== undefined ? object.name : '알 수 없음';
object.author = object.author !== undefined ? object.author : '알 수 없음';

// 속성이 false로 반환될 수 있는 값이 들어오지 않을 것이라는 전제가 있으면 짧은 조건문으로도 구현
// 객체의 기본 속성을 지정합니다.
// 'object.name'이 falsy 값(null, undefined, '', 0, false)일 때 '알 수 없음'이 할당됩니다.
// object.name = object.name || '알 수 없음';
// object.author = object.author || '알 수 없음';

// 객체 내부에 속성이 있는지 확인합니다.
if(object.name) {
    console.log('name 속성이 있습니다.');
} else {
    console.log('name 속성이 없습니다.');
}

if (object.author) {
    console.log('author 속성이 있습니다.');
} else {
    console.log('author 속성이 없습니다.');
}

// 짧은 조건문으로 더 짧게도 사용 가능
// 객체 내부에 속성이 있는지 확인합니다.
// object.name || console.log('name 속성이 없습니다.');
// object.author || console.log('author 속성이 없습니다.');

// 객체를 출력합니다.
console.log(JSON.stringify(object, null, 2));
</script>
